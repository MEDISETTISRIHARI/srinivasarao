<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srihari LIC Advisor</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">

<div class="container">

    <div class="card">

        <h1>Welcome 👋</h1>

        <p class="subtitle">
            Get FREE LIC Health & Financial Protection Consultation
        </p>

        <form id="leadForm">

            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label>Mobile Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your mobile number"
                required
            >

            <label>Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter your age"
                required
            >

            <label>Who is the policy for?</label>

            <select id="relation">
                <option>Myself</option>
                <option>My Father</option>
                <option>My Mother</option>
                <option>My Child</option>
                <option>My Wife</option>
                <option>My Husband</option>
                <option>Someone Else</option>
            </select>

            <button type="submit">
                Continue →
            </button>

        </form>

        <p class="note">
            By continuing, you agree that our LIC advisor may contact you by
            phone, WhatsApp or SMS regarding insurance consultation.
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
